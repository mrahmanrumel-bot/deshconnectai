<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>চ্যাট — DeshConnect AI</title>
  <link rel="icon" href="icon.png" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <style>
    .chat-page { height: calc(100vh - 77px); display: flex; flex-direction: column; max-width: 860px; margin: 0 auto; width: 100%; }
    #messages { flex: 1; overflow: auto; padding: 20px 16px 8px; }
    .msg { margin: 10px 0; display: flex; flex-direction: column; }
    .msg.user { align-items: flex-end; }
    .bubble {
      max-width: 80%;
      padding: 12px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 15px;
    }
    .msg.bot .bubble { background: var(--panel); border: 1px solid var(--line); }
    .msg.user .bubble { background: #143226; }
    .sources { font-size: 12px; color: var(--muted); margin: 6px 4px 0; }
    .composer {
      display: flex; gap: 8px; padding: 12px 16px 20px;
      border-top: 1px solid var(--line);
      background: rgba(5,8,6,.9);
    }
    #q {
      flex: 1; resize: none; min-height: 46px; max-height: 120px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px; padding: 12px;
      font: inherit;
    }
    .keybar { display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
    .keybar input { flex:1; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font:inherit; font-size:13px; }
    #keystatus { color:var(--muted); font-size:12px; white-space:nowrap; }
    .suggest { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
    .suggest button {
      background: transparent; color: var(--muted); border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px;
    }
  </style>
</head>
<body>
  <header class="top">
    <a href="index.html"><img class="brand" src="logo.png" alt="DeshConnect AI" /></a>
    <nav>
      <a href="index.html">হোম</a>
      <a class="active" href="chat.html">চ্যাট</a>
    </nav>
  </header>
  <div class="chat-page">
    <div class="keybar">
      <input id="apikey" type="password" placeholder="Gemini API কী (শুধু এই ফোনে সেভ)" />
      <button class="btn btn-ghost" id="savekey" type="button">কী সেভ</button>
      <span id="keystatus"></span>
    </div>
    <div id="messages"></div>
    <div class="suggest">
      <button type="button" onclick="ask('NID সংশোধন কোথায় করব?')">NID</button>
      <button type="button" onclick="ask('পাসপোর্ট স্ট্যাটাস কিভাবে দেখব?')">পাসপোর্ট</button>
      <button type="button" onclick="ask('TIN ও ই-রিটার্ন কোথায়?')">TIN / কর</button>
      <button type="button" onclick="ask('খতিয়ান কিভাবে দেখব?')">ভূমি</button>
      <button type="button" onclick="ask('জরুরি নম্বর')">হটলাইন</button>
    </div>
    <div class="composer">
      <textarea id="q" placeholder="বাংলায় বা ইংরেজিতে লিখুন..."></textarea>
      <button class="btn btn-primary" id="send" type="button">পাঠান</button>
    </div>
  </div>
  <script src="kb.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
